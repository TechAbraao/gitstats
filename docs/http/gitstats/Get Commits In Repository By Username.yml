info:
  name: Get Commits In Repository By Username
  type: http
  seq: 3

http:
  method: GET
  url: https://api.github.com/repos/TechAbraao/jobs/commits?per_page=1
  headers:
    - name: Accept
      value: application/vnd.github+json
  params:
    - name: per_page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
